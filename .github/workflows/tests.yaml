name: tests

on:
  push:
    branches: ["master"]
    paths:
      - '**.go'
      - '**.mod'
  pull_request:
    paths:
      - '**.go'
      - '**.mod'
  workflow_dispatch: {}

jobs:
  changes:
    if: ${{ !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changed modules
        id: detect
        run: |
          set -euo pipefail

          # The go command ignores testdata directories, so a go.mod there
          # is a test fixture, not a module.
          list_modules() {
            find . -name 'go.mod' -type f -not -path '*/testdata/*' -exec dirname {} \; | sed 's|^\./||' | sort -r
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            # Handle null SHA (first push or force push)
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="HEAD~1"
            fi
          else
            # workflow_dispatch or other events: run all modules
            echo "modules=$(list_modules | jq -R . | jq -s -c .)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Comparing $BASE..$HEAD"
          git diff --name-only "$BASE" "$HEAD" || true

          # A changed file belongs only to the innermost module containing
          # it, so a change under exp/file selects exp/file but not exp.
          mapfile -t all_modules < <(list_modules)
          declare -A changed=()
          while IFS= read -r file; do
            owner=""
            for dir in "${all_modules[@]}"; do
              if [[ "$file" == "$dir"/* && ${#dir} -gt ${#owner} ]]; then
                owner=$dir
              fi
            done
            if [ -n "$owner" ]; then
              changed[$owner]=1
            fi
          done < <(git diff --name-only "$BASE" "$HEAD")

          modules=()
          for dir in "${all_modules[@]}"; do
            if [ -n "${changed[$dir]:-}" ]; then
              echo "Module changed: $dir"
              modules+=("$dir")
            fi
          done

          if [ ${#modules[@]} -eq 0 ]; then
            echo "modules=[]" >> "$GITHUB_OUTPUT"
            echo "No modules changed"
          else
            json=$(printf '%s\n' "${modules[@]}" | jq -R . | jq -s -c .)
            echo "modules=$json" >> "$GITHUB_OUTPUT"
            echo "Changed modules: $json"
          fi

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.modules != '[]' && needs.changes.outputs.modules != '' }}
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - run: |
          echo "Running golangci-lint on module: ${{ matrix.module }}"
          echo "${{ needs.changes.outputs.modules }}"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: "latest"
          working-directory: ${{ matrix.module }}

  tests:
    needs: [changes, lint]
    if: ${{ needs.changes.outputs.modules != '[]' && needs.changes.outputs.modules != '' }}
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        id: setup-go-from-mod
        continue-on-error: true
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: actions/setup-go@v7
        if: ${{ steps.setup-go-from-mod.outcome == 'failure' }}
        with:
          go-version: "stable"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go test -v ./...
        env:
          CGO_ENABLED: "0"
        working-directory: ${{ matrix.module }}
      - run: go test -v -race ./...
        working-directory: ${{ matrix.module }}

  go-getter:
    needs: [changes, lint, tests]
    if: ${{ github.event_name == 'push' && needs.changes.outputs.modules != '[]' && needs.changes.outputs.modules != '' }}
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - uses: oven-sh/setup-bun@v2
      - run: bun run scripts/go-getter.js ${{ matrix.module }}
